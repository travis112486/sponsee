<!doctype html>
<!--
  og-image.png source (SPO-299). 1200x630 at DPR 2, downscaled with sips.
  Tokens mirror apps/marketing/tailwind.config.js: paper #F7F5F1, ink #1B1815,
  ink-2 #57504A, ink-3 #757069, hairline #E8E3DB, pine #0E7A5F, surface #FFFFFF,
  platform dots twitch/youtube/tiktok/kick. Fonts are the self-hosted woff2.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Instrument Serif";
    src: url("../public/fonts/instrument-serif-latin-400-normal.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "Inter";
    src: url("../public/fonts/inter-latin-400-normal.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "Inter";
    src: url("../public/fonts/inter-latin-500-normal.woff2") format("woff2");
    font-weight: 500;
  }
  @font-face {
    font-family: "Inter";
    src: url("../public/fonts/inter-latin-600-normal.woff2") format("woff2");
    font-weight: 600;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #F7F5F1;
    font-family: "Inter", sans-serif;
    color: #1B1815;
    position: relative;
  }
  /* Soft pine wash in the top-right corner, same spirit as the hero backdrop */
  .wash {
    position: absolute;
    top: -340px; right: -300px;
    width: 900px; height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(14, 122, 95, 0.07) 0%, rgba(14, 122, 95, 0.0) 72%);
  }
  .frame {
    position: absolute;
    inset: 0;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .wordmark {
    font-family: "Instrument Serif", serif;
    font-size: 40px;
    line-height: 1;
  }
  .wordmark sup { font-size: 20px; }
  h1 {
    font-family: "Instrument Serif", serif;
    font-weight: 400;
    font-size: 88px;
    line-height: 1.05;
    letter-spacing: -0.015em;
    max-width: 1020px;
  }
  h1 .pine { color: #0E7A5F; }
  .sub {
    margin-top: 28px;
    font-size: 26px;
    line-height: 1.55;
    color: #57504A;
  }
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .platforms {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 20px;
    font-weight: 500;
    color: #757069;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .dot + span { margin-right: 10px; }
  .url {
    font-size: 22px;
    font-weight: 600;
    color: #0E7A5F;
  }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="frame">
    <div class="wordmark">Sponsee<sup>™</sup></div>
    <div>
      <h1>Run your sponsorships<br /><span class="pine">like an agency.</span> Keep&nbsp;100%.</h1>
      <p class="sub">The sponsorship CRM for streamers — one pipeline, CPVH-benchmarked pricing,<br />automatic late-payment chasing. Flat price, no cut.</p>
    </div>
    <div class="foot">
      <div class="platforms">
        <span class="dot" style="background:#8B5CF6"></span><span>Twitch</span>
        <span class="dot" style="background:#E5484D"></span><span>YouTube</span>
        <span class="dot" style="background:#1B1815"></span><span>TikTok</span>
        <span class="dot" style="background:#58A617"></span><span>Kick</span>
      </div>
      <div class="url">sponsee.app</div>
    </div>
  </div>
</body>
</html>
