name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # SPO-165: the Vercel ignoreCommand skips builds for commits that don't
      # touch the web app. That is only safe while apps/web has no runtime
      # @sponsee/api or @sponsee/db dependency — this guard fails CI if one is
      # added, forcing the author to widen the watch list or restructure.
      - run: node scripts/verify-web-import-guard.mjs
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # SPO-241: a route chunk that quietly triples is not a failing test. This
      # asserts framer-motion's engine stayed in the shared `motion-*` chunk
      # instead of being statically linked into a route, and holds every chunk
      # to a gzip ceiling. Reads apps/web/dist, so it must follow `pnpm build`.
      - run: node scripts/verify-web-bundle-budget.mjs

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # apps/* import @sponsee/db and @sponsee/shared through their `dist`
      # entrypoints and dist/ is gitignored, so without this the suite dies on
      # "Cannot find package '@sponsee/db'". Only the libraries are built — the
      # web bundle is the `build` job's business.
      - run: pnpm --filter "./packages/*" build
      # Two SPO-68 acceptance tests in chase-integration.test.ts deliberately
      # refuse to skip when Mailpit is missing — they assert against a real
      # inbox, and a silent skip would let CI go green without ever exercising
      # the chase send path. They need Mailpit two different ways: one spawns
      # its own instance on free ports (so the binary must be on PATH), the
      # other talks to the conventional dev instance on 1025/8025 (so one must
      # already be running).
      - name: Install and start Mailpit
        env:
          MAILPIT_VERSION: v1.31.0
        run: |
          curl -fsSL "https://github.com/axllent/mailpit/releases/download/${MAILPIT_VERSION}/mailpit-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin mailpit
          # SPO-275: --no-release-check is load-bearing, not cosmetic. Bare
          # `mailpit version` queries api.github.com for a newer release and
          # exits 1 if that call fails, so under `bash -e` a transient
          # api.github.com timeout reds the whole `test` job (it did, on main:
          # run 33565003071). The flag keeps the smoke line proving the binary
          # is on PATH and runs, without coupling it to a third-party network
          # call. Verify it still exists before bumping MAILPIT_VERSION.
          mailpit version --no-release-check
          nohup mailpit -d "$RUNNER_TEMP/mailpit-ci.db" -q >"$RUNNER_TEMP/mailpit.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8025/api/v1/messages >/dev/null; then
              echo "Mailpit ready on :8025"
              exit 0
            fi
            sleep 1
          done
          echo "Mailpit did not become ready on :8025 within 30s" >&2
          cat "$RUNNER_TEMP/mailpit.log" >&2
          exit 1
      # Deliberately no DATABASE_URL: packages/db falls back to in-memory PGlite
      # when it is unset, and that is what the integration tests are written
      # against. Pointing them at a real Postgres would silently change what
      # they exercise.
      - run: pnpm test

  # SPO-171: wire-level proof the storage module works against a real S3
  # server. Separate job (not folded into `test`) because it needs MinIO and
  # is the one suite here that must never silently no-op if that's missing —
  # see storage.e2e.test.ts's header comment.
  storage-e2e:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" build
      # `services:` only starts a container's default CMD with no way to pass
      # arguments, and minio/minio's image needs `server /data` as its
      # command — so this starts it directly instead, the same way the
      # Mailpit step above installs and backgrounds a binary rather than
      # using a service container.
      #
      # Pinned (SPO-351): unpinned `minio/minio` tracks `latest`, and a future
      # MinIO release that starts validating checksums would fail this job on
      # an unrelated PR with a confusing error — see storage.test.ts's
      # "no checksum query parameters" test for the underlying issue.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data --console-address ":9001"
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/ready >/dev/null; then
              echo "MinIO ready on :9000"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready on :9000 within 30s" >&2
          docker logs minio >&2
          exit 1
      - run: pnpm test:storage-e2e
        env:
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_BUCKET: sponsee-storage-e2e
          STORAGE_REGION: us-east-1
          STORAGE_ACCESS_KEY_ID: minioadmin
          STORAGE_SECRET_ACCESS_KEY: minioadmin

  db-check:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sponsee
          POSTGRES_PASSWORD: sponsee
          POSTGRES_DB: sponsee
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://sponsee:sponsee@localhost:5432/sponsee
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://sponsee:sponsee@localhost:5432/sponsee

      # The Render pre-deploy migrator (SPO-74). Proves a clean database ends up
      # fully migrated, that re-running is a no-op, and — the part that matters —
      # that a database drizzle would silently skip exits non-zero so Render
      # aborts the deploy instead of releasing code against a stale schema.
      - run: pnpm --filter @sponsee/db build
      - run: node scripts/verify-deploy-migrator.mjs
        env:
          DATABASE_URL: postgres://sponsee:sponsee@localhost:5432/sponsee
